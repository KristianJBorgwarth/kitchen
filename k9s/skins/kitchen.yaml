# -----------------------------------------------------------------------------
# kitchen skin: mostly grayscale, background inherits the terminal's, with green/red
# reserved for status signal only. The palette block below is generated.
# -----------------------------------------------------------------------------

# --- palette: generated by quickshell from quickshell/theme/dark.json; edit the palette there ---
fg: &fg "#e8e8e8"
bright: &bright "#e8e8e8"
dim: &dim "#808080"
muted: &muted "#5a5a5a"
faint: &faint "#3a3a3a"
dark: &dark "#141414"
green: &green "#87af5f"
red: &red "#d75f5f"
# --- end palette ---

# Skin...
k9s:
  body:
    fgColor: *fg
    bgColor: default
    logoColor: *fg
  prompt:
    fgColor: *fg
    bgColor: default
    suggestColor: *dim
  info:
    fgColor: *dim
    sectionColor: *fg
  dialog:
    fgColor: *fg
    bgColor: default
    buttonFgColor: *dark
    buttonBgColor: *bright
    buttonFocusFgColor: *dark
    buttonFocusBgColor: *green
    labelFgColor: *dim
    fieldFgColor: *fg
  frame:
    border:
      fgColor: *faint
      focusColor: *bright
    menu:
      fgColor: *fg
      keyColor: *green
      numKeyColor: *green
    crumbs:
      fgColor: *fg
      bgColor: *faint
      activeColor: *green
    status:
      newColor: *bright
      modifyColor: *dim
      addColor: *green
      errorColor: *red
      highlightColor: *bright
      killColor: *red
      completedColor: *muted
    title:
      fgColor: *fg
      bgColor: default
      highlightColor: *green
      counterColor: *dim
      filterColor: *green
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - *green
        - *red
      defaultChartColors:
        - *green
        - *red
    table:
      fgColor: *fg
      bgColor: default
      cursorFgColor: *dark
      cursorBgColor: *fg
      markColor: *green
      header:
        fgColor: *dim
        bgColor: default
        sorterColor: *green
    xray:
      fgColor: *fg
      bgColor: default
      cursorColor: *faint
      graphicColor: *green
      showIcons: false
    yaml:
      keyColor: *dim
      colonColor: *faint
      valueColor: *fg
    logs:
      fgColor: *fg
      bgColor: default
      indicator:
        fgColor: *fg
        bgColor: default
        toggleOnColor: *green
        toggleOffColor: *faint
    help:
      fgColor: *fg
      bgColor: default
      keyColor: *green
      numKeyColor: *green
      sectionColor: *dim
