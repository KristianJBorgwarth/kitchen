# lazygit, colored from the kitchen palette. The theme block below and delta.gitconfig next
# to this file are written by quickshell (ThemeExport) for the active light/dark mode; edit
# the palette in quickshell/theme/<mode>.json, the rest of this file is hand-written.
gui:
  # --- theme: generated by quickshell from quickshell/theme/dark.json; edit the palette there ---
  theme:
    activeBorderColor: ["#a7c080", bold]
    inactiveBorderColor: ["#5a5a5a"]
    searchingActiveBorderColor: ["#dbbc7f", bold]
    optionsTextColor: ["#808080"]
    selectedLineBgColor: ["#3a3a3a"]
    inactiveViewSelectedLineBgColor: ["#1e1e1e"]
    cherryPickedCommitFgColor: ["#7fbbb3"]
    cherryPickedCommitBgColor: ["#1e1e1e"]
    markedBaseCommitFgColor: ["#dbbc7f"]
    markedBaseCommitBgColor: ["#1e1e1e"]
    unstagedChangesColor: ["#e67e80"]
    defaultFgColor: [default]
  # --- end theme ---
git:
  # delta: syntax highlighting, soft +/- line tints and word-level changes
  diffRenderers:
    - name: delta
      type: stdinFilter
      # through sh so $HOME expands however lazygit splits the command
      command: sh -c 'exec delta --paging=never --config "$HOME/.config/lazygit/delta.gitconfig"'
