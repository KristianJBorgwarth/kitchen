# raw cava output for the bar equalizer (services/Cava.qml)
# pulse input works on both PipeWire (via pipewire-pulse) and plain PulseAudio
[general]
bars = 48
framerate = 60
autosens = 1

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
monstercat = 1
noise_reduction = 70
